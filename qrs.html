<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos QR - SW&Go</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: 'var(--brand-primary, #12B89B)',
              dark: 'var(--brand-dark, #0E937C)',
              light: 'var(--brand-light, #EDFBF8)',
            },
            base: {
              bg: '#F9FAFB',
              card: '#FFFFFF',
              border: '#E5E7EB',
              text: '#1F2937',
              muted: '#6B7280',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    .font-serif-title { font-family: 'Playfair Display', serif; }
    
    @media print {
      body { background: white !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      #qrGrid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 16px !important;
        max-width: 100% !important;
        margin: 0 !important;
      }
      .qr-card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 1.5px dashed #9CA3AF !important;
        box-shadow: none !important;
        background: white !important;
        padding: 16px !important;
      }
    }
  </style>
</head>
<body class="bg-base-bg text-base-text p-6 min-h-screen font-sans">

  <!-- Panel de control de configuración (se oculta al imprimir) -->
  <header class="max-w-4xl mx-auto bg-base-card p-6 rounded-3xl shadow-sm mb-8 no-print border border-base-border">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-base-border">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-base-text text-base-card flex items-center justify-center text-xl font-bold">
          🖨️
        </div>
        <div>
          <h1 id="headerTitle" class="font-serif-title text-xl font-bold text-base-text">Generador de Códigos QR</h1>
          <p id="headerSubtitle" class="text-xs text-base-muted">Sincronizado con las mesas y colores configurados en tu panel</p>
        </div>
      </div>

      <span id="tableCountBadge" class="text-xs font-extrabold px-3 py-1.5 rounded-xl bg-primary-light text-primary-dark border border-primary/20 self-start sm:self-center">
        Cargando mesas...
      </span>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 text-xs font-semibold">
      <div class="sm:col-span-8">
        <label class="block text-base-muted uppercase tracking-wider mb-1.5 text-[11px] font-bold">
          URL base de tu carta (index.html):
        </label>
        <input 
          type="text" 
          id="baseUrl" 
          placeholder="https://tudominio.com/index.html"
          class="w-full bg-base-bg border border-base-border rounded-xl p-2.5 outline-none focus:border-primary text-base-text"
        >
      </div>

      <div class="sm:col-span-4 flex items-end gap-2">
        <button 
          onclick="renderQRs()" 
          class="flex-1 bg-base-text text-base-card py-2.5 rounded-xl font-bold hover:bg-black transition-all text-xs uppercase tracking-wider shadow-xs active:scale-95"
        >
          Actualizar
        </button>
        <button 
          onclick="window.print()" 
          class="bg-primary text-white px-4 py-2.5 rounded-xl font-bold hover:bg-primary-dark transition-all text-xs uppercase tracking-wider shadow-xs active:scale-95 flex items-center gap-1.5"
        >
          <span>🖨️</span>
          <span>Imprimir</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor con las tarjetas listas para pantalla e impresora -->
  <main id="qrGrid" class="max-w-5xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
    <div class="col-span-full text-center py-20 text-base-muted text-xs font-semibold">
      Cargando mesas desde Supabase...
    </div>
  </main>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE (SW&Go / QR&Go)
    // ==========================================
    const SUPABASE_URL = "https://admoytjzbhdngkcafhua.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9KG1_KEF4Ik4SpmfTdEUqA_7vRD5Cq0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let restaurantData = null;
    let tablesList = [];
    let currentBrandDark = '#0E937C';

    function applyBrandTheme(hex) {
      const cleanHex = /^#[0-9A-F]{6}$/i.test(hex || '') ? hex : '#12B89B';
      const r = parseInt(cleanHex.slice(1, 3), 16);
      const g = parseInt(cleanHex.slice(3, 5), 16);
      const b = parseInt(cleanHex.slice(5, 7), 16);

      const darkR = Math.max(0, Math.floor(r * 0.8));
      const darkG = Math.max(0, Math.floor(g * 0.8));
      const darkB = Math.max(0, Math.floor(b * 0.8));
      const darkHex = `#${darkR.toString(16).padStart(2, '0')}${darkG.toString(16).padStart(2, '0')}${darkB.toString(16).padStart(2, '0')}`;

      const lightR = Math.min(255, Math.floor(r + (255 - r) * 0.92));
      const lightG = Math.min(255, Math.floor(g + (255 - g) * 0.92));
      const lightB = Math.min(255, Math.floor(b + (255 - b) * 0.92));
      const lightHex = `#${lightR.toString(16).padStart(2, '0')}${lightG.toString(16).padStart(2, '0')}${lightB.toString(16).padStart(2, '0')}`;

      currentBrandDark = darkHex;
      document.documentElement.style.setProperty('--brand-primary', cleanHex);
      document.documentElement.style.setProperty('--brand-dark', darkHex);
      document.documentElement.style.setProperty('--brand-light', lightHex);
    }

    // Detectar automáticamente la URL base de index.html en el mismo servidor
    const defaultIndexUrl = window.location.href.split('?')[0].replace(/qrs\.html$/i, 'index.html');
    document.getElementById('baseUrl').value = defaultIndexUrl;

    async function initQRGenerator() {
      const urlParams = new URLSearchParams(window.location.search);
      const restSlug = urlParams.get('rest') || 'qr-and-go';

      const { data: rest, error } = await sb
        .from('restaurants')
        .select('*')
        .eq('slug', restSlug)
        .single();

      if (error || !rest) {
        document.getElementById('qrGrid').innerHTML = `
          <div class="col-span-full text-center py-16 text-red-600 font-bold text-sm">
            No se encontró el restaurante "${restSlug}" en Supabase.
          </div>`;
        return;
      }

      restaurantData = rest;
      applyBrandTheme(rest.primary_color);

      document.title = `Códigos QR - ${rest.name}`;
      document.getElementById('headerTitle').innerText = `Códigos QR • ${rest.name}`;

      await loadAndRenderTables();

      // Escuchar cambios en vivo en el restaurante (color) y en las mesas
      sb.channel('qrs-live-' + rest.id)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'restaurants',
          filter: `id=eq.${rest.id}`
        }, (payload) => {
          if (payload.new) {
            restaurantData = payload.new;
            applyBrandTheme(restaurantData.primary_color);
            document.getElementById('headerTitle').innerText = `Códigos QR • ${restaurantData.name}`;
            renderQRs();
          }
        })
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'tables',
          filter: `restaurant_id=eq.${rest.id}`
        }, () => {
          loadAndRenderTables();
        })
        .subscribe();
    }

    async function loadAndRenderTables() {
      const { data: tables, error: tablesErr } = await sb
        .from('tables')
        .select('*')
        .eq('restaurant_id', restaurantData.id);

      if (tablesErr || !tables || tables.length === 0) {
        document.getElementById('tableCountBadge').innerText = '0 mesas';
        document.getElementById('qrGrid').innerHTML = `
          <div class="col-span-full text-center py-16 bg-base-card rounded-3xl border border-base-border p-6">
            <p class="text-base font-bold text-base-text">Aún no hay mesas configuradas</p>
            <p class="text-xs text-base-muted mt-1">Ve a <strong>panel.html → ⚙️ Mesas & Local</strong> y define cuántas mesas tiene este restaurante.</p>
          </div>`;
        return;
      }

      tablesList = tables.sort((a, b) => {
        const numA = parseInt(a.table_number.replace(/\D/g, ''), 10) || 0;
        const numB = parseInt(b.table_number.replace(/\D/g, ''), 10) || 0;
        return numA - numB;
      });

      document.getElementById('tableCountBadge').innerText = `${tablesList.length} mesas activas`;
      renderQRs();
    }

    function renderQRs() {
      const container = document.getElementById('qrGrid');
      container.innerHTML = '';

      let base = document.getElementById('baseUrl').value.trim();
      if (base.endsWith('/')) base = base.slice(0, -1);

      tablesList.forEach((t, idx) => {
const tableUrl = `${base}?token=${encodeURIComponent(t.qr_slug)}`;
        const qrElementId = `qrcode-${idx}`;

        const card = document.createElement('div');
        card.className = "qr-card bg-base-card p-5 rounded-3xl border border-base-border shadow-xs flex flex-col items-center justify-between text-center transition-all";
        
        card.innerHTML = `
          <div>
            <p class="text-[9px] font-black text-primary-dark uppercase tracking-widest mb-0.5">${restaurantData.name}</p>
            <h2 class="text-xl font-black font-serif-title text-base-text mb-3">${t.table_number}</h2>
          </div>
          
          <div class="p-2.5 bg-white rounded-2xl shadow-2xs border-2 border-primary/25 flex items-center justify-center">
            <div id="${qrElementId}"></div>
          </div>
          
          <div class="mt-3.5">
            <p class="text-[11px] font-extrabold text-primary-dark tracking-tight">Escanea para pedir</p>
            <p class="text-[9px] text-base-muted font-semibold mt-0.5">Carta digital y sellos</p>
          </div>
        `;

        container.appendChild(card);

        new QRCode(document.getElementById(qrElementId), {
          text: tableUrl,
          width: 125,
          height: 125,
          colorDark: "#18181B",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    initQRGenerator();
  </script>
</body>
</html>
